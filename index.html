<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Clause HQ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ─────────────────────────────────────── */
:root {
  --bg:       #f5f5f4;
  --s1:       #ffffff;
  --s2:       #f9f9f8;
  --s3:       #f0efed;
  --s4:       #e8e7e4;
  --b0:       rgba(0,0,0,.07);
  --b1:       rgba(0,0,0,.10);
  --b2:       rgba(0,0,0,.16);
  --tx:       #111110;
  --t1:       #6b6b68;
  --t2:       #a0a09c;
  --ac:       #6558f5;
  --ac-hi:    #7c72f7;
  --ac-lo:    rgba(101,88,245,.08);
  --ac-mid:   rgba(101,88,245,.16);
  --green:    #16a34a;
  --green-lo: rgba(22,163,74,.09);
  --amber:    #b45309;
  --amber-lo: rgba(180,83,9,.09);
  --red:      #dc2626;
  --red-lo:   rgba(220,38,38,.09);
  --r:        8px;
  --r-sm:     6px;
  --r-lg:     10px;
  --font:     'Inter', -apple-system, sans-serif;
  --sidebar:  224px;
  --topbar:   52px;
  --trans:    .15s ease;
}

/* ─── RESET ──────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-font-smoothing:antialiased;}
body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:14px;line-height:1.5;min-height:100vh;overflow-x:hidden;}
a{color:inherit;text-decoration:none;}
button{font-family:var(--font);cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:var(--font);}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--b1);border-radius:4px;}

/* ─── LOGIN ──────────────────────────────────────── */
#loginScreen{
  position:fixed;inset:0;background:var(--bg);z-index:1000;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.lc{width:100%;max-width:400px;}
.lc-brand{margin-bottom:40px;}
.lc-logo{font-size:20px;font-weight:600;letter-spacing:-.3px;color:var(--tx);}
.lc-logo span{color:var(--ac);}
.lc-sub{font-size:12px;color:var(--t2);margin-top:4px;}
.lc-label{font-size:12px;font-weight:500;color:var(--t1);margin-bottom:6px;display:block;}
.lc-input{
  width:100%;background:var(--s2);border:1px solid var(--b0);border-radius:var(--r);
  padding:10px 12px;color:var(--tx);font-size:14px;outline:none;margin-bottom:10px;
  transition:border-color var(--trans);
}
.lc-input:focus{border-color:var(--ac);}
.lc-input::placeholder{color:var(--t2);}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;}
.role-btn{
  background:var(--s2);border:1px solid var(--b0);border-radius:var(--r);
  padding:12px;cursor:pointer;transition:all var(--trans);text-align:left;
}
.role-btn:hover{border-color:var(--b2);}
.role-btn.selected{border-color:var(--ac);background:var(--ac-lo);}
.role-btn .ri{font-size:18px;margin-bottom:6px;display:block;}
.role-btn .rn{font-size:13px;font-weight:500;color:var(--tx);display:block;}
.role-btn .rd{font-size:12px;color:var(--t2);margin-top:1px;}
.lc-btn{
  width:100%;background:var(--ac);border:none;border-radius:var(--r);
  padding:11px;font-size:14px;font-weight:500;color:#fff;cursor:pointer;
  transition:background var(--trans);
}
.lc-btn:hover{background:var(--ac-hi);}
.lc-hint{font-size:12px;color:var(--t2);text-align:center;margin-top:12px;}

/* ─── APP SHELL ──────────────────────────────────── */
#app{display:none;min-height:100vh;}
.shell{display:flex;min-height:100vh;}

/* ─── SIDEBAR ────────────────────────────────────── */
.sidebar{
  width:var(--sidebar);background:var(--s1);
  border-right:1px solid var(--b0);
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;height:100vh;z-index:100;
  transition:transform .25s ease;
}
.sb-head{padding:16px 16px 12px;border-bottom:1px solid var(--b0);}
.sb-logo{font-size:15px;font-weight:600;letter-spacing:-.2px;color:var(--tx);}
.sb-logo span{color:var(--ac);}
.sb-role-pill{
  display:inline-flex;align-items:center;gap:5px;
  margin-top:8px;font-size:11px;font-weight:500;
  padding:3px 8px;border-radius:4px;
}
.rp-founder{background:var(--ac-lo);color:var(--ac);}
.rp-manager{background:var(--green-lo);color:var(--green);}
.rp-freelancer{background:var(--amber-lo);color:var(--amber);}
.rp-client{background:rgba(255,255,255,.06);color:var(--t1);}
.sb-nav{flex:1;padding:8px;overflow-y:auto;}
.nav-section{margin-bottom:20px;}
.nav-section-label{
  font-size:11px;font-weight:500;color:var(--t2);
  text-transform:uppercase;letter-spacing:.6px;
  padding:0 8px;margin-bottom:4px;
}
.nav-item{
  display:flex;align-items:center;gap:8px;
  padding:7px 8px;border-radius:var(--r-sm);
  font-size:13px;color:var(--t1);
  cursor:pointer;transition:all var(--trans);
  user-select:none;position:relative;
}
.nav-item:hover{background:var(--s3);color:var(--tx);}
.nav-item.active{background:var(--ac-lo);color:var(--ac);}
.nav-item.active .ni{opacity:1;}
.ni{font-size:14px;width:16px;text-align:center;flex-shrink:0;opacity:.7;}
.nav-item.active .ni{opacity:1;}
.nbadge{
  margin-left:auto;font-size:11px;font-weight:500;
  background:var(--s4);color:var(--t1);
  padding:1px 6px;border-radius:20px;
}
.sb-footer{padding:12px;border-top:1px solid var(--b0);}
.user-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r);}
.user-av{
  width:28px;height:28px;border-radius:6px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;
}
.user-name{font-size:13px;font-weight:500;line-height:1.2;}
.user-email{font-size:11px;color:var(--t2);margin-top:1px;}
.logout-btn{
  width:100%;margin-top:8px;background:none;border:1px solid var(--b0);
  border-radius:var(--r-sm);padding:7px;font-size:12px;color:var(--t2);
  transition:all var(--trans);
}
.logout-btn:hover{border-color:var(--b2);color:var(--t1);}

/* ─── MAIN ───────────────────────────────────────── */
.main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{
  height:var(--topbar);padding:0 24px;
  border-bottom:1px solid var(--b0);
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg);position:sticky;top:0;z-index:50;
}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-title{font-size:15px;font-weight:600;letter-spacing:-.2px;}
.hamburger{
  display:none;background:var(--s2);border:1px solid var(--b0);
  border-radius:var(--r-sm);padding:6px 9px;font-size:14px;color:var(--t1);
}
.topbar-right{display:flex;align-items:center;gap:8px;}
.content{padding:32px 28px;flex:1;max-width:1200px;}

/* ─── ANIMATION ──────────────────────────────────── */
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .2s ease;}

/* ─── BUTTONS ────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:var(--r-sm);
  font-size:13px;font-weight:500;
  cursor:pointer;transition:all var(--trans);border:none;
}
.btn-primary{background:var(--ac);color:#fff;}
.btn-primary:hover{background:var(--ac-hi);}
.btn-ghost{background:var(--s2);color:var(--t1);border:1px solid var(--b0);}
.btn-ghost:hover{background:var(--s3);color:var(--tx);border-color:var(--b1);}
.btn-sm{padding:5px 11px;font-size:12px;}
.btn-danger{background:var(--red-lo);color:var(--red);border:1px solid rgba(239,68,68,.15);}
.btn-danger:hover{background:rgba(239,68,68,.2);}

/* ─── CARDS ──────────────────────────────────────── */
.card{background:var(--s1);border:1px solid var(--b0);border-radius:var(--r-lg);}
.card-head{padding:16px 20px 0;display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:13px;font-weight:600;color:var(--tx);}
.card-body{padding:12px 20px 20px;}

/* ─── STAT CARDS ─────────────────────────────────── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px;}
.stat-card{
  background:var(--s1);border:1px solid var(--b0);
  border-radius:var(--r-lg);padding:18px 20px;
  transition:border-color var(--trans);cursor:default;
}
.stat-card:hover{border-color:var(--b1);}
.stat-label{font-size:12px;color:var(--t2);font-weight:500;margin-bottom:8px;}
.stat-value{font-size:26px;font-weight:600;letter-spacing:-.5px;line-height:1;}
.stat-meta{font-size:12px;color:var(--t2);margin-top:6px;}
.stat-meta.up{color:var(--green);}

/* ─── TABLE ──────────────────────────────────────── */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead th{
  text-align:left;font-size:11px;font-weight:500;
  color:var(--t2);text-transform:uppercase;letter-spacing:.5px;
  padding:10px 16px;border-bottom:1px solid var(--b0);
}
tbody td{
  padding:12px 16px;font-size:13px;
  border-bottom:1px solid var(--b0);vertical-align:middle;
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--s2);}

/* ─── BADGES ─────────────────────────────────────── */
.badge{
  display:inline-flex;align-items:center;
  padding:2px 8px;border-radius:4px;
  font-size:11px;font-weight:500;
}
.b-green{background:var(--green-lo);color:var(--green);}
.b-amber{background:var(--amber-lo);color:var(--amber);}
.b-red{background:var(--red-lo);color:var(--red);}
.b-purple{background:var(--ac-lo);color:var(--ac);}
.b-neutral{background:var(--s3);color:var(--t1);}
.b-blue{background:rgba(59,130,246,.12);color:#60a5fa;}

/* ─── STATUS DOT ─────────────────────────────────── */
.sdot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px;flex-shrink:0;}
.sdot-green{background:var(--green);}
.sdot-amber{background:var(--amber);}
.sdot-red{background:var(--red);}

/* ─── AVATAR ─────────────────────────────────────── */
.av{
  width:30px;height:30px;border-radius:6px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;
}
.cell-av{display:flex;align-items:center;gap:10px;}
.cell-av-info .name{font-size:13px;font-weight:500;}
.cell-av-info .sub{font-size:12px;color:var(--t2);margin-top:1px;}

/* ─── SECTION HEADER ─────────────────────────────── */
.sec-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;gap:12px;flex-wrap:wrap;}
.sec-title{font-size:18px;font-weight:600;letter-spacing:-.3px;}
.sec-sub{font-size:13px;color:var(--t2);margin-top:3px;}

/* ─── FILTER BAR ─────────────────────────────────── */
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.finput{
  background:var(--s2);border:1px solid var(--b0);border-radius:var(--r-sm);
  padding:8px 12px;color:var(--tx);font-size:13px;flex:1;min-width:180px;
  outline:none;transition:border-color var(--trans);
}
.finput:focus{border-color:var(--ac);}
.finput::placeholder{color:var(--t2);}
.fselect{
  background:var(--s2);border:1px solid var(--b0);border-radius:var(--r-sm);
  padding:8px 12px;color:var(--t1);font-size:13px;outline:none;cursor:pointer;
}

/* ─── GRID LAYOUTS ───────────────────────────────── */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.dash-grid{display:grid;grid-template-columns:1fr 320px;gap:16px;}

/* ─── PROJECT / TASK ROWS ────────────────────────── */
.row-item{
  background:var(--s1);border:1px solid var(--b0);border-radius:var(--r-lg);
  padding:16px 20px;margin-bottom:8px;
  transition:border-color var(--trans);cursor:default;
}
.row-item:hover{border-color:var(--b1);}
.row-item:last-child{margin-bottom:0;}

/* ─── PROGRESS ───────────────────────────────────── */
.prog{height:3px;background:var(--s3);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;transition:width .5s ease;}

/* ─── MEETING ROW ────────────────────────────────── */
.meet-row{
  display:flex;align-items:center;gap:14px;
  padding:14px 0;border-bottom:1px solid var(--b0);
}
.meet-row:last-child{border-bottom:none;}
.meet-time-block{
  background:var(--s2);border-radius:var(--r-sm);
  padding:8px 12px;text-align:center;min-width:56px;flex-shrink:0;
}
.meet-time-block .hr{font-size:16px;font-weight:600;color:var(--tx);}
.meet-time-block .dy{font-size:11px;color:var(--t2);margin-top:2px;}
.meet-info .title{font-size:13px;font-weight:500;}
.meet-info .meta{font-size:12px;color:var(--t2);margin-top:2px;}

/* ─── CLIENT CARD ────────────────────────────────── */
.client-card{
  background:var(--s1);border:1px solid var(--b0);border-radius:var(--r-lg);
  padding:18px;transition:border-color var(--trans);cursor:default;
}
.client-card:hover{border-color:var(--b1);}
.clogo{
  width:36px;height:36px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;
}
.cstats-row{display:flex;gap:20px;padding-top:12px;margin-top:12px;border-top:1px solid var(--b0);}
.cstat .v{font-size:18px;font-weight:600;letter-spacing:-.3px;}
.cstat .l{font-size:11px;color:var(--t2);margin-top:2px;}

/* ─── ACTIVITY ───────────────────────────────────── */
.act-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--b0);}
.act-row:last-child{border-bottom:none;}
.act-dot{width:6px;height:6px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.act-text{font-size:13px;line-height:1.5;color:var(--t1);}
.act-text strong{color:var(--tx);font-weight:500;}
.act-time{font-size:11px;color:var(--t2);margin-top:2px;}

/* ─── MODAL ──────────────────────────────────────── */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;
  display:none;align-items:center;justify-content:center;padding:16px;
  backdrop-filter:blur(3px);
}
.modal-bg.open{display:flex;}
.modal{
  background:var(--s1);border:1px solid var(--b1);border-radius:var(--r-lg);
  width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  animation:fadeIn .18s ease;
}
.modal-head{padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-size:16px;font-weight:600;letter-spacing:-.2px;}
.modal-close{
  width:28px;height:28px;background:var(--s3);border-radius:5px;
  cursor:pointer;font-size:14px;color:var(--t1);
  display:flex;align-items:center;justify-content:center;
  transition:all var(--trans);
}
.modal-close:hover{background:var(--s4);color:var(--tx);}
.modal-body{padding:16px 20px 20px;}

/* ─── PROGRESS STEPS ─────────────────────────────── */
.steps-bar{display:flex;gap:4px;margin-bottom:20px;}
.step-seg{flex:1;height:2px;border-radius:2px;background:var(--s4);transition:background .25s;}
.step-seg.done{background:var(--ac);}
.step-seg.active{background:var(--ac);}

/* ─── FORMS ──────────────────────────────────────── */
.fg{margin-bottom:14px;}
.fl{font-size:12px;font-weight:500;color:var(--t1);margin-bottom:6px;display:block;}
.fi{
  width:100%;background:var(--s2);border:1px solid var(--b0);
  border-radius:var(--r-sm);padding:9px 12px;color:var(--tx);font-size:13px;
  outline:none;transition:border-color var(--trans);
}
.fi:focus{border-color:var(--ac);}
.fi::placeholder{color:var(--t2);}
.fi-select{
  width:100%;background:var(--s2);border:1px solid var(--b0);
  border-radius:var(--r-sm);padding:9px 12px;color:var(--tx);font-size:13px;
  outline:none;cursor:pointer;
}
.fi-select:focus{border-color:var(--ac);}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.ffoot{
  display:flex;gap:8px;justify-content:flex-end;
  padding-top:12px;margin-top:4px;border-top:1px solid var(--b0);
}
.ftag-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.ftag{
  background:var(--s3);border:1px solid var(--b0);border-radius:4px;
  padding:4px 10px;font-size:12px;color:var(--t1);cursor:pointer;
  transition:all var(--trans);
}
.ftag:hover{border-color:var(--b2);}
.ftag.on{background:var(--ac-lo);border-color:var(--ac);color:var(--ac);}
.wizard-hd{margin-bottom:20px;}
.wizard-step-label{font-size:11px;font-weight:500;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.wizard-title{font-size:16px;font-weight:600;letter-spacing:-.2px;}
.wizard-sub{font-size:13px;color:var(--t2);margin-top:3px;}
.info-box{
  background:var(--s2);border-radius:var(--r-sm);padding:12px 14px;
  font-size:12px;color:var(--t1);line-height:1.6;margin-bottom:14px;
}
.info-box strong{color:var(--tx);font-weight:500;}

/* ─── ADMIN TABS ─────────────────────────────────── */
.tab-bar{display:flex;gap:2px;margin-bottom:20px;border-bottom:1px solid var(--b0);padding-bottom:0;}
.tab{
  padding:8px 14px;font-size:13px;font-weight:500;color:var(--t2);
  cursor:pointer;border-bottom:2px solid transparent;
  transition:all var(--trans);margin-bottom:-1px;
}
.tab:hover{color:var(--t1);}
.tab.active{color:var(--tx);border-bottom-color:var(--ac);}

/* ─── TOAST ──────────────────────────────────────── */
.toast{
  position:fixed;bottom:20px;right:20px;
  background:var(--s3);border:1px solid var(--b1);
  border-radius:var(--r);padding:10px 16px;
  font-size:13px;z-index:999;
  display:none;max-width:280px;color:var(--tx);
}
.toast.show{display:block;animation:fadeIn .2s ease;}

/* ─── OVERLAY ────────────────────────────────────── */
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;}
.sb-overlay.open{display:block;}

/* ─── EMPTY STATE ────────────────────────────────── */
.empty-state{text-align:center;padding:48px 24px;}
.empty-state .icon{font-size:28px;margin-bottom:10px;}
.empty-state .title{font-size:14px;font-weight:500;color:var(--t1);margin-bottom:6px;}
.empty-state .sub{font-size:13px;color:var(--t2);}

/* ─── DIVIDER ────────────────────────────────────── */
.divider-label{
  font-size:11px;font-weight:500;color:var(--t2);
  text-transform:uppercase;letter-spacing:.5px;
  margin:16px 0 10px;
}

/* ─── NOTIFICATION BELL ──────────────────────────── */
.notif-btn{
  position:relative;background:var(--s2);border:1px solid var(--b0);
  border-radius:var(--r-sm);padding:6px 10px;font-size:14px;color:var(--t1);
  cursor:pointer;transition:all var(--trans);
}
.notif-btn:hover{background:var(--s3);}
.notif-dot{
  position:absolute;top:4px;right:4px;width:7px;height:7px;
  background:var(--red);border-radius:50%;border:1.5px solid var(--bg);
}
.notif-panel{
  position:fixed;top:var(--topbar);right:16px;width:320px;
  background:var(--s1);border:1px solid var(--b1);border-radius:var(--r-lg);
  box-shadow:0 8px 32px rgba(0,0,0,.12);z-index:200;
  display:none;animation:fadeIn .15s ease;
  max-height:480px;overflow-y:auto;
}
.notif-panel.open{display:block;}
.notif-header{padding:14px 16px 10px;border-bottom:1px solid var(--b0);display:flex;align-items:center;justify-content:space-between;}
.notif-header-title{font-size:13px;font-weight:600;}
.notif-clear{font-size:12px;color:var(--ac);cursor:pointer;}
.notif-item{
  display:flex;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--b0);cursor:pointer;
  transition:background var(--trans);
}
.notif-item:last-child{border-bottom:none;}
.notif-item:hover{background:var(--s2);}
.notif-item.unread{background:var(--ac-lo);}

<script type="module">
// ══════════ SUPABASE CONNECTION ══════════
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = window.__SUPABASE_URL__;
const SUPABASE_ANON_KEY = window.__SUPABASE_ANON_KEY__;
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
window.supabase = supabase; // used by inline onclick handlers below

// ══════════ STATE ══════════
let currentUser = null;
let currentSection = '';
let myProfile = null; // real profiles row: {id, full_name, email, role:{key,label}, client_id}

// DB starts empty; loadAllData() fills it from Supabase after login,
// using the SAME field names the existing render functions expect,
// so nothing below this point needs to change.
const DB = {
  freelancers: [], clients: [], meetings: [], projects: [], tasks: [],
  activity: [], expenses: [], notifications: [], sops: [], approvals: [], timeLogs: []
};

const COLOR_POOL = ['#7c6dfa','#22c55e','#f59e0b','#60a5fa','#ec4899','#14b8a6'];
function colorFor(id){ return COLOR_POOL[Math.abs(hashStr(String(id))) % COLOR_POOL.length]; }
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h<<5)-h+s.charCodeAt(i); h|=0; } return h; }
function initials(name){ return (name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }
function inr(n){ return '₹' + Number(n||0).toLocaleString('en-IN'); }
function fmtDate(d){ return d ? new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : ''; }

// ══════════ LOAD REAL DATA ══════════
async function loadAllData(){
  const [
    { data: clients },
    { data: projects },
    { data: freelancers },
    { data: meetings },
    { data: tasks },
    { data: expenses },
    { data: notifications },
    { data: sops },
    { data: approvals },
  ] = await Promise.all([
    supabase.from('clients').select('*'),
    supabase.from('projects').select('*, status:project_statuses(label), client:clients(name)'),
    supabase.from('freelancers').select('*'),
    supabase.from('meetings').select('*, client:clients(name)').order('scheduled_at'),
    supabase.from('tasks').select('*, project:projects(name), assigned_freelancer:freelancers(name)'),
    supabase.from('expenses').select('*, client:clients(name)').order('expense_date', {ascending:false}),
    supabase.from('notifications').select('*').eq('profile_id', myProfile.id).order('created_at', {ascending:false}).limit(20),
    supabase.from('sops').select('*'),
    supabase.from('approval_requests').select('*, project:projects(name, client:clients(name))'),
  ]);

  DB.clients = (clients||[]).map(c => ({
    id: c.id, name: c.name, industry: c.notes || '—', contact: c.contact_name,
    email: c.contact_email, phone: c.contact_phone,
    budget: inr(c.retainer_amount || 0), scope: c.notes || '',
    contract: 'Signed', status: 'Active',
    logo: initials(c.name), color: colorFor(c.id),
    revenue: inr(c.retainer_amount || 0),
    projects: (projects||[]).filter(p => p.client_id === c.id).length,
  }));

  DB.projects = (projects||[]).map(p => ({
    id: p.id, title: p.name, client: p.client?.name || '—',
    status: p.status?.label || 'New', progress: p._progress || 50,
    deadline: fmtDate(p.due_date), budget: inr(p.budget || 0),
    freelancers: [], client_id: p.client_id,
  }));

  DB.freelancers = (freelancers||[]).map(f => ({
    id: f.id, name: f.name, role: f.role_title, email: f.email,
    rate: f.rate ? `${inr(f.rate)}/hr` : '—', status: f.status === 'active' ? 'Active' : f.status === 'on_leave' ? 'On Leave' : 'Inactive',
    skills: f.skills || [], portfolio: f.portfolio_url, bank: f.bank_details,
    contract: f.contract_status === 'signed' ? 'Signed' : 'Pending',
    projects: 0, payout: '—', payoutStatus: 'NA',
    avatar: initials(f.name), color: colorFor(f.id),
  }));

  DB.meetings = (meetings||[]).map(m => ({
    id: m.id, title: m.title, client: m.client?.name || '—',
    date: fmtDate(m.scheduled_at), time: new Date(m.scheduled_at).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}),
    duration: `${m.duration_minutes} min`, attendees: [], type: m.meeting_type || 'Meeting',
  }));

  DB.tasks = (tasks||[]).map(t => ({
    id: t.id, title: t.title, project: t.project?.name || '—', client: '—',
    deadline: fmtDate(t.due_date),
    status: t.status === 'in_progress' ? 'In Progress' : t.status === 'todo' ? 'Todo' : t.status === 'review' ? 'Review' : 'Complete',
    priority: t.priority ? t.priority[0].toUpperCase()+t.priority.slice(1) : 'Medium',
    freelancer: t.assigned_freelancer?.name || '—',
  }));

  DB.expenses = (expenses||[]).map(e => ({
    id: e.id, title: e.title, category: e.category[0].toUpperCase()+e.category.slice(1),
    amount: e.amount, date: e.expense_date, client: e.client?.name || 'Internal',
    notes: e.notes || '', receipt: e.has_receipt,
  }));

  DB.notifications = (notifications||[]).map(n => ({
    id: n.id, icon: n.icon || '•', text: n.text, time: fmtDate(n.created_at), unread: !n.read,
  }));

  DB.sops = sops || [];
  DB.approvals = (approvals||[]).map(a => ({
    id: a.id, title: a.title, project: a.project?.name || '—', client: a.project?.client?.name || '—',
    status: a.status, description: a.description, comment: a.decision_comment,
  }));

  DB.activity = []; // populated from recent records below
  const recent = [];
  (clients||[]).slice(-1).forEach(c => recent.push({text:`New client <strong>${c.name}</strong> onboarded`, color:'var(--ac)', time: fmtDate(c.created_at)}));
  DB.activity = recent;
}

// ══════════ LOGIN (real Supabase auth) ══════════
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword')?.value || '';
  if(!email || !password){ showToast('Enter your email and password'); return; }

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if(error){ showToast(error.message); return; }

  const { data: profile, error: profileError } = await supabase
    .from('profiles')
    .select('*, role:roles(key, label)')
    .eq('id', data.user.id)
    .single();

  if(profileError || !profile){ showToast('No profile found for this login — contact the founder.'); return; }

  myProfile = profile;
  currentUser = {
    name: profile.full_name, email: profile.email,
    role: profile.role.key === 'team_member' ? 'manager' : profile.role.key, // manager = Team Lead in UI
    avatar: initials(profile.full_name),
  };

  await loadAllData();

  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  initApp();
}

async function doLogout(){
  await supabase.auth.signOut();
  currentUser = null; myProfile = null;
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('app').style.display='none';
}

// Restore session on page load (so refresh doesn't log you out)
(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if(session){
    const { data: profile } = await supabase.from('profiles').select('*, role:roles(key, label)').eq('id', session.user.id).single();
    if(profile){
      myProfile = profile;
      currentUser = { name: profile.full_name, email: profile.email, role: profile.role.key === 'team_member' ? 'manager' : profile.role.key, avatar: initials(profile.full_name) };
      await loadAllData();
      document.getElementById('loginScreen').style.display='none';
      document.getElementById('app').style.display='block';
      initApp();
    }
  }
})();

window.doLogin = doLogin;
window.doLogout = doLogout;

// ══════════ INIT ══════════
function initApp(){
  const sbNav=document.getElementById('sbNav');
  sbNav.innerHTML=NAV[currentUser.role].map(g=>`
    <div class="nav-section">
      <div class="nav-section-label">${g.label}</div>
      ${g.items.map(i=>`

          <span>${i.label}</span>
          ${i.badge?`<span class="nbadge">${i.badge()}</span>`:''}
        </div>`).join('')}
    </div>`).join('');

  const roleColors={founder:'#7c6dfa',manager:'#22c55e',freelancer:'#f59e0b',client:'#a0a0a0'};
  const c=roleColors[currentUser.role];
  const av=document.getElementById('userAv');
  av.style.cssText=`background:${c}20;color:${c}`;
  av.textContent=currentUser.avatar;
  document.getElementById('userName').textContent=currentUser.name;
  document.getElementById('userEmail').textContent=currentUser.email;

  const pill=document.getElementById('sbRolePill');
  pill.textContent=ROLE_LABELS[currentUser.role];
  pill.className=`sb-role-pill rp-${currentUser.role}`;

  const first=NAV[currentUser.role][0].items[0].id;
  showSection(first,document.getElementById('ni-'+first));
  renderNotifList();updateNotifDot();
}

// ══════════ SECTION ROUTER ══════════
function showSection(id,el){
  currentSection=id;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(el)el.classList.add('active');
  else document.querySelectorAll('.nav-item').forEach(n=>{if(n.textContent.trim().startsWith(SECTION_TITLES[id]?.split(' ')[0]))n.classList.add('active');});
  document.getElementById('topTitle').textContent=SECTION_TITLES[id]||id;
  const mc=document.getElementById('mainContent');
  mc.innerHTML='';mc.className='content fade-in';
  document.getElementById('topbarRight').innerHTML='';
  const renders={
    dashboard:renderDashboard,freelancers:renderFreelancers,clients:renderClients,
    meetings:renderMeetings,projects:renderProjects,finance:renderFinance,
    admin:renderAdmin,ai:renderAI,tasks:renderAllTasks,
    mytasks:renderMyTasks,myprojects:renderMyProjects,mypayouts:renderMyPayouts,
    clientprojects:renderClientProjects,clientmeetings:renderClientMeetings,clientfiles:renderClientFiles,
    calendar:renderCalendar,expenses:renderExpenses,
    sops:renderSOPs,timetracker:renderTimeTracker,
    approvals:renderApprovals,clientapprovals:renderClientApprovals,
  };
  if(renders[id])renders[id]();
  closeSb();
}

// ══════════ HELPERS ══════════
function statusBadge(s){
  const m={'Active':'b-green','Signed':'b-green','Paid':'b-green','Complete':'b-green','In Progress':'b-purple','Review':'b-blue','Pending':'b-amber','On Leave':'b-amber','Todo':'b-neutral','Paused':'b-neutral','NA':'b-neutral'};
  return `<span class="badge ${m[s]||'b-neutral'}">${s}</span>`;
}
function priorityBadge(p){
  const m={High:'b-red',Medium:'b-amber',Low:'b-neutral'};
  return `<span class="badge ${m[p]||'b-neutral'}">${p}</span>`;
}
function progColor(s){
  return s==='Review'?'#60a5fa':s==='Complete'?'#22c55e':'#7c6dfa';
}

function buildCtx(){
  return `You are Clause AI for Creative Clause, a creative agency. Be concise.
FREELANCERS: ${DB.freelancers.map(f=>`${f.name}|${f.role}|${f.status}|${f.projects} projects|${f.rate}`).join('; ')}

}
async function sendAI(){
  const inp=document.getElementById('aiIn');
  const msg=inp.value.trim();if(!msg)return;
  inp.value='';
  appendMsg(msg,'user');aiHistory.push({role:'user',content:msg});
  const loader=appendLoader();
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,system:buildCtx(),messages:aiHistory})});
    const d=await res.json();loader.remove();
    const reply=d.content?.[0]?.text||'Could not get a response.';
    appendMsg(reply,'ai');aiHistory.push({role:'assistant',content:reply});
  }catch(e){loader.remove();appendMsg('Connection error — please try again.','ai');}
}
function appendMsg(text,who){
  const el=document.getElementById('aiMsgs');if(!el)return;
  const isAI=who==='ai';
  el.innerHTML+=`<div style="display:flex;justify-content:${isAI?'flex-start':'flex-end'}">
    <div><div style="font-size:11px;color:var(--t2);margin-bottom:4px;text-align:${isAI?'left':'right'}">${isAI?'Clause AI':'You'}</div>
    <div style="background:${isAI?'var(--s3)':'var(--ac)'};color:${isAI?'var(--t1)':'#fff'};border-radius:${isAI?'0 8px 8px 8px':'8px 0 8px 8px'};padding:10px 14px;font-size:13px;line-height:1.6;max-width:80%">${text}</div></div>
  </div>`;
  el.scrollTop=el.scrollHeight;
}
function appendLoader(){
  const el=document.getElementById('aiMsgs');if(!el)return{remove:()=>{}};
  const d=document.createElement('div');
  d.innerHTML=`<div style="background:var(--s3);border-radius:0 8px 8px 8px;padding:10px 14px;font-size:13px;color:var(--t2)">…</div>`;
  el.appendChild(d);el.scrollTop=el.scrollHeight;return d;
}
function askChip(q){const i=document.getElementById('aiIn');if(i){i.value=q;sendAI();}}

function toggleSkill(el,sk){

}
function wNext(){

let calYear=2026,calMonth=2; // 0-indexed, 2=March
function renderCalendar(){
  document.getElementById('mainContent').innerHTML=`
  <div class="sec-head">
    <div><div class="sec-title">Calendar</div><div class="sec-sub">Tasks, meetings & project deadlines</div></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost btn-sm" onclick="calView='month';renderCalendar()">Month</button>
      <button class="btn btn-ghost btn-sm" onclick="calView='timeline';renderCalendar()">Timeline</button>
    </div>
  </div>
  <div id="calContainer"></div>`;
  if(typeof calView==='undefined'||calView==='month')renderMonthCal();
  else renderTimeline();

let calView='month';

function renderMonthCal(){
  const y=calYear,m=calMonth;
  const firstDay=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const daysInPrev=new Date(y,m,0).getDate();
  const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const today=new Date();

  // Gather events for this month
  const events=[];
  DB.meetings.forEach(mt=>{
    const d=parseDateStr(mt.date,y,m);
    if(d&&d.getMonth()===m&&d.getFullYear()===y)
      events.push({day:d.getDate(),label:mt.title,type:'meeting'});
  });
  DB.projects.forEach(p=>{
    const d=parseDeadline(p.deadline);
    if(d&&d.getMonth()===m&&d.getFullYear()===y)
      events.push({day:d.getDate(),label:'📌 '+p.title,type:'deadline'});
  });
  DB.tasks.forEach(t=>{
    const d=parseDeadline(t.deadline);
    if(d&&d.getMonth()===m&&d.getFullYear()===y)
      events.push({day:d.getDate(),label:t.title,type:'task'});
  });

  // Build grid cells
  let cells=[];
  for(let i=firstDay-1;i>=0;i--)cells.push({day:daysInPrev-i,other:true});
  for(let i=1;i<=daysInMonth;i++)cells.push({day:i,other:false});
  while(cells.length%7!==0)cells.push({day:cells.length-daysInMonth-firstDay+2,other:true});

  const cont=document.getElementById('calContainer');
  cont.innerHTML=`
  <div class="cal-wrap">
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCalendar()">‹</button>
      <div class="cal-month-title">${monthNames[m]} ${y}</div>
      <button class="cal-nav-btn" onclick="calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCalendar()">›</button>
    </div>
    <div class="cal-grid">
      ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells.map(c=>{
        const isToday=!c.other&&c.day===today.getDate()&&m===today.getMonth()&&y===today.getFullYear();
        const dayEvents=events.filter(e=>e.day===c.day&&!c.other);
        return `<div class="cal-day ${c.other?'other-month':''} ${isToday?'today':''}">
          <div class="cal-day-num">${c.day}</div>
          ${dayEvents.slice(0,3).map(e=>`<div class="cal-event cal-event-${e.type}" title="${e.label}">${e.label}</div>`).join('')}
          ${dayEvents.length>3?`<div style="font-size:10px;color:var(--t2);padding:1px 4px">+${dayEvents.length-3} more</div>`:''}
        </div>`;
      }).join('')}
    </div>
    <div class="cal-legend">
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--ac)"></div>Project deadline</div>
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--green)"></div>Meeting</div>
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--amber)"></div>Task due</div>
    </div>
  </div>`;
}

function renderTimeline(){
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  // Show 4 months starting from Jan 2026
  const startDate=new Date(2026,0,1);
  const endDate=new Date(2026,4,1);
  const totalDays=(endDate-startDate)/(1000*60*60*24);
  const today=new Date();
  const todayPct=Math.max(0,Math.min(100,((today-startDate)/(endDate-startDate))*100));

  function getPct(dateStr){
    const d=parseDeadline(dateStr);if(!d)return null;
    return Math.max(0,Math.min(100,((d-startDate)/(endDate-startDate))*100));
  }
  function getStartPct(p){
    // estimate start as deadline minus ~30 days * (1-progress/100)
    const d=parseDeadline(p.deadline);if(!d)return 0;
    const daysLeft=Math.round(30*(1-p.progress/100));
    const start=new Date(d);start.setDate(start.getDate()-daysLeft*3);
    return Math.max(0,Math.min(95,((start-startDate)/(endDate-startDate))*100));
  }

  const cont=document.getElementById('calContainer');
  cont.innerHTML=`
  <div class="card" style="padding:20px">
    <div style="font-size:13px;font-weight:600;margin-bottom:16px">Project Timeline — Jan to May 2026</div>
    <div class="timeline-wrap">
      <div class="timeline-grid">
        <div class="tl-header">
          <div class="tl-label"></div>
          <div class="tl-months">${['Jan 26','Feb 26','Mar 26','Apr 26','May 26'].map(mn=>`<div class="tl-month">${mn}</div>`).join('')}</div>
        </div>
        ${DB.projects.map(p=>{
          const startPct=getStartPct(p);
          const endPct=getPct(p.deadline)||95;
          const width=Math.max(5,endPct-startPct);
          const colors={'In Progress':'#7c6dfa','Review':'#60a5fa','Complete':'#22c55e','Paused':'#a0a09c'};
          const color=colors[p.status]||'#7c6dfa';
          return `<div class="tl-row">
            <div class="tl-row-label"><div class="name">${p.title}</div><div class="sub">${p.client}</div></div>
            <div class="tl-bar-wrap">
              <div class="today-line" style="left:${todayPct}%"></div>
              <div class="tl-bar" style="left:${startPct}%;width:${width}%;background:${color}" title="${p.title} — due ${p.deadline}">
                ${width>8?p.progress+'%':''}
              </div>
            </div>
          </div>`;
        }).join('')}
        ${DB.meetings.map(mt=>{
          const d=parseDateStr(mt.date,2026,2);
          if(!d)return '';
          const pct=((d-startDate)/(endDate-startDate))*100;
          if(pct<0||pct>100)return '';
          return `<div class="tl-row">
            <div class="tl-row-label"><div class="name">${mt.title}</div><div class="sub">${mt.client}</div></div>
            <div class="tl-bar-wrap">
              <div class="today-line" style="left:${todayPct}%"></div>
              <div class="tl-bar" style="left:${Math.max(0,pct-0.5)}%;width:2%;background:#22c55e;min-width:8px" title="${mt.title}"></div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div style="display:flex;gap:16px;margin-top:16px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t1)"><div style="width:12px;height:8px;background:#7c6dfa;border-radius:2px"></div>In Progress</div>
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t1)"><div style="width:12px;height:8px;background:#60a5fa;border-radius:2px"></div>Review</div>
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t1)"><div style="width:12px;height:8px;background:#22c55e;border-radius:2px"></div>Meeting</div>
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t1)"><div style="width:2px;height:14px;background:var(--red);opacity:.5"></div>Today</div>
    </div>
  </div>`;
}

function parseDateStr(str,y,m){
  if(!str)return null;
  const months={'Jan':0,'Feb':1,'Mar':2,'Apr':3,'May':4,'Jun':5,'Jul':6,'Aug':7,'Sep':8,'Oct':9,'Nov':10,'Dec':11};
  if(str==='Today')return new Date(y,m,new Date().getDate());
  if(str==='Tomorrow'){const d=new Date();d.setDate(d.getDate()+1);return d;}
  const parts=str.match(/(\d+)\s+(\w+)/);
  if(parts)return new Date(y,months[parts[2]]||m,parseInt(parts[1]));
  return null;
}
function parseDeadline(str){
  if(!str||str==='TBD')return null;
  const months={'Jan':0,'Feb':1,'Mar':2,'Apr':3,'May':4,'Jun':5,'Jul':6,'Aug':7,'Sep':8,'Oct':9,'Nov':10,'Dec':11};
  const parts=str.match(/(\d+)\s+(\w+)\s+(\d+)/);
  if(parts)return new Date(parseInt(parts[3]),months[parts[2]],parseInt(parts[1]));
  return null;
}

async function saveExpense(){
  const title=document.getElementById('ex-title').value.trim();
  if(!title){showToast('Title required');return;}
  const amount=parseFloat(document.getElementById('ex-amount').value)||0;
  const clientName=document.getElementById('ex-client').value;
  const client = clientName!=='Internal' ? DB.clients.find(c=>c.name===clientName) : null;

  const { data, error } = await supabase.from('expenses').insert({
    title, category: (document.getElementById('ex-cat').value||'other').toLowerCase(),
    amount, expense_date: document.getElementById('ex-date').value || new Date().toISOString().slice(0,10),
    client_id: client?.id || null,
    notes: document.getElementById('ex-notes').value || null,
    has_receipt: document.getElementById('ex-receipt').checked,
  }).select().single();

  if(error){ showToast('Could not save: '+error.message); return; }

  DB.expenses.unshift({
    id:data.id,title,
    category:document.getElementById('ex-cat').value,
    amount,
    date:data.expense_date,
    client:clientName,
    notes:document.getElementById('ex-notes').value,
    receipt:document.getElementById('ex-receipt').checked
  });
  closeModal();showToast('Expense added');
  if(currentSection==='expenses')renderExpenses();
}

function toggleSOP(id,e){
  e.stopPropagation();

}

      <button class="btn btn-ghost" onclick="stopTimer()" id="timerStopBtn" style="display:none">⏹ Stop & Log</button>
      <button class="btn btn-ghost btn-sm" onclick="resetTimer()">Reset</button>
      <button class="btn btn-ghost btn-sm" onclick="openManualLog()">+ Log manually</button>
    </div>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
    <div class="sec-title" style="font-size:14px">${isFL?'My time logs':'All time logs'}</div>

  <div class="card">

      <tbody id="timeLogBody"></tbody>
    </table></div>
  </div>`;

  renderTimeLogs(myLogs);
  // Restore running timer if any
  if(timerRunning){
    document.getElementById('timerDisplay').classList.add('running');
    document.getElementById('timerStartBtn').style.display='none';
    document.getElementById('timerStopBtn').style.display='inline-flex';
    if(document.getElementById('timerProject'))document.getElementById('timerProject').value=timerProject;
    if(document.getElementById('timerTask'))document.getElementById('timerTask').value=timerTask;
  }
}

function renderTimeLogs(logs){
  const tb=document.getElementById('timeLogBody');if(!tb)return;
  const isFL=currentUser.role==='freelancer';
  if(!logs.length){tb.innerHTML=`<tr><td colspan="5"><div class="empty-state"><div class="title">No logs yet</div><div class="sub">Start a timer or log manually</div></div></td></tr>`;return;}
  tb.innerHTML=logs.map(l=>`<tr>
    <td style="color:var(--t1)">${isFL?l.date:l.freelancer}</td>
    <td style="font-weight:500">${l.project}</td>
    <td style="color:var(--t1)">${l.task}</td>
    <td><span class="time-log-hrs">${l.hours}h</span></td>
    <td style="color:var(--t2);font-size:12px">${l.note||'—'}</td>
  </tr>`).join('');
}

function startTimer(){
  const proj=document.getElementById('timerProject')?.value;
  const task=document.getElementById('timerTask')?.value.trim();
  if(!proj){showToast('Select a project first');return;}
  timerProject=proj;timerTask=task;
  timerRunning=true;
  document.getElementById('timerDisplay').classList.add('running');
  document.getElementById('timerStartBtn').style.display='none';
  document.getElementById('timerStopBtn').style.display='inline-flex';
  timerInterval=setInterval(()=>{
    timerSeconds++;
    const h=Math.floor(timerSeconds/3600).toString().padStart(2,'0');
    const m=Math.floor((timerSeconds%3600)/60).toString().padStart(2,'0');
    const s=(timerSeconds%60).toString().padStart(2,'0');
    const disp=document.getElementById('timerDisplay');
    if(disp)disp.textContent=`${h}:${m}:${s}`;
  },1000);
}

function stopTimer(){
  if(!timerRunning)return;
  clearInterval(timerInterval);timerRunning=false;
  const hrs=Math.round((timerSeconds/3600)*4)/4; // round to nearest 0.25
  const today=new Date().toISOString().split('T')[0];
  DB.timeLogs.unshift({id:Date.now(),freelancer:currentUser.name,project:timerProject,task:timerTask||'General work',hours:Math.max(0.25,hrs),date:today,note:'Logged via timer'});
  DB.activity.unshift({text:`<strong>${currentUser.name}</strong> logged ${Math.max(0.25,hrs)}h on ${timerProject}`,color:'var(--green)',time:'Just now'});
  showToast(`${Math.max(0.25,hrs)}h logged for ${timerProject}`);
  timerSeconds=0;timerProject='';timerTask='';
  document.getElementById('timerDisplay').classList.remove('running');
  document.getElementById('timerStartBtn').style.display='inline-flex';
  document.getElementById('timerStopBtn').style.display='none';
  const disp=document.getElementById('timerDisplay');if(disp)disp.textContent='00:00:00';
  if(currentSection==='timetracker')renderTimeTracker();
}

function resetTimer(){
  clearInterval(timerInterval);timerRunning=false;timerSeconds=0;
  const disp=document.getElementById('timerDisplay');
  if(disp){disp.textContent='00:00:00';disp.classList.remove('running');}
  const startBtn=document.getElementById('timerStartBtn');
  const stopBtn=document.getElementById('timerStopBtn');
  if(startBtn)startBtn.style.display='inline-flex';
  if(stopBtn)stopBtn.style.display='none';
}

  const filesRaw=document.getElementById('ap-files').value;
  const files=filesRaw.split(',').map(f=>f.trim()).filter(Boolean);
  DB.approvals.unshift({id:Date.now(),title,project:document.getElementById('ap-project').value,client:document.getElementById('ap-client').value,submittedBy:currentUser.name,date:new Date().toISOString().split('T')[0],status:'pending',files,note:document.getElementById('ap-note').value,clientComment:''});
  DB.notifications.unshift({id:Date.now(),icon:'✔',text:`Approval submitted: <strong>${title}</strong> — awaiting client`,time:'Just now',unread:true});
  DB.activity.unshift({text:`<strong>${title}</strong> submitted for client approval`,color:'var(--ac)',time:'Just now'});
  closeModal();showToast('Submitted for approval');
  if(currentSection==='approvals')renderApprovals();
}

// ══════════ CLIENT APPROVALS VIEW ══════════
function renderClientApprovals(){
  const myApprovals=DB.approvals; // In real app, filter by client
  document.getElementById('mainContent').innerHTML=`
  <div class="sec-head">
    <div><div class="sec-title">Approvals</div><div class="sec-sub">Review and approve deliverables from Creative Clause</div></div>
  </div>
  ${myApprovals.length===0?`<div class="empty-state"><div class="icon">✔</div><div class="title">No approvals yet</div><div class="sub">Deliverables submitted by your team will appear here</div></div>`:''}
  ${myApprovals.map(a=>`
  <div class="approval-card ${a.status}" style="margin-bottom:12px">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px">
      <div>
        <div style="font-size:14px;font-weight:600;color:var(--tx);margin-bottom:3px">${a.title}</div>
        <div class="approval-meta">${a.project} · Submitted ${a.date}</div>
      </div>
      <span class="badge ${{pending:'b-amber',approved:'b-green',changes:'b-red'}[a.status]||'b-neutral'}">${{pending:'Needs your review',approved:'You approved this',changes:'Changes requested'}[a.status]||a.status}</span>
    </div>
    <div style="margin-bottom:10px">${a.files.map(f=>`<span class="approval-file-chip">📄 ${f}</span>`).join('')}</div>
    ${a.note?`<div style="font-size:13px;color:var(--t2);margin-bottom:10px">${a.note}</div>`:''}
    ${a.status==='pending'?`
    <div class="fg" style="margin-bottom:10px">
      <label class="fl">Leave a comment (optional)</label>
      <textarea class="fi" id="clientComment-${a.id}" rows="2" placeholder="Your feedback or revision notes…">${a.clientComment||''}</textarea>
    </div>
    <div class="approval-btns">
      <button class="btn btn-primary" onclick="clientApprove(${a.id})">✓ Approve</button>
      <button class="btn btn-danger" onclick="clientRequestChanges(${a.id})">Request changes</button>
    </div>`:''}
    ${a.status==='changes'&&a.clientComment?`<div class="approval-comment">"${a.clientComment}"</div>`:''}
  </div>`).join('')}`;
}
function clientApprove(id){
  const a=DB.approvals.find(a=>a.id===id);
  if(a){
    a.status='approved';
    a.clientComment=document.getElementById('clientComment-'+id)?.value||'';
    DB.notifications.unshift({id:Date.now(),icon:'✅',text:`<strong>${a.client}</strong> approved: ${a.title}`,time:'Just now',unread:true});
    DB.activity.unshift({text:`<strong>${a.client}</strong> approved <strong>${a.title}</strong>`,color:'var(--green)',time:'Just now'});
    showToast('Approved! Agency will be notified.');
    renderClientApprovals();
  }
}
function clientRequestChanges(id){
  const a=DB.approvals.find(a=>a.id===id);
  if(a){
    const comment=document.getElementById('clientComment-'+id)?.value||'Please review and revise.';
    a.status='changes';a.clientComment=comment;
    DB.notifications.unshift({id:Date.now(),icon:'🔄',text:`<strong>${a.client}</strong> requested changes on: ${a.title}`,time:'Just now',unread:true});
    DB.activity.unshift({text:`<strong>${a.client}</strong> requested changes on <strong>${a.title}</strong>`,color:'var(--amber)',time:'Just now'});
    showToast('Feedback sent to agency.');
    renderClientApprovals();
  }
}
